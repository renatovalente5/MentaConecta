<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menta Conecta — Em breve</title>

<!-- A página do «Em breve» (11 nov 2026, pedida pelo Yuri): vive na raiz do domínio até o site
     estar pronto. Não se indexa: o motor de busca fica com o site verdadeiro, não com a espera.
     Autónoma (sem o gerador do site): o CI copia esta pasta tal e qual para o alojamento. Os
     endereços começam na raiz (/fontes/…) porque qualquer endereço desconhecido mostra esta página. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E2A22">
<meta property="og:title" content="Menta Conecta — Em breve">
<meta property="og:description" content="Fardamentos, gráfica rápida e brindes com a sua marca.">
<meta property="og:image" content="https://mentaconecta.pt/partilha.png">
<meta property="og:locale" content="pt_PT">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/fontes/bricolage-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* As letras e as cores são as do site (assets/css/base.css): o M do logótipo dá a menta, o
   amarelo e o magenta; o fundo é o verde-escuro das secções escuras. */
@font-face { font-family: "Bricolage"; src: url("/fontes/bricolage-var.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }
@font-face { font-family: "Inter"; src: url("/fontes/inter-var.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --fundo: #0E2A22; --texto: #FFFFFF; --texto-2: #C5D3CD;
  --menta: #209478; --menta-claro: #6FD8B9; --magenta: #D81C5C; --magenta-claro: #FF80AA;
  --amarelo: #FFEC08; --verde-vivo: #25D366; --tinta: #14211D;
  --letra: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --letra-titulo: "Bricolage", "Inter", system-ui, sans-serif;
  --mola: cubic-bezier(.34, 1.56, .64, 1); --suave: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--fundo); color: var(--texto); font: 400 1.0625rem/1.55 var(--letra);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow-x: hidden;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 3px; border-radius: 6px; }

/* As facetas do site por trás de tudo, a derivar devagar; o centro escurece para o título. */
.fundo { position: fixed; inset: -6%; z-index: -2; background: url("/facetas-cor.svg") center / cover no-repeat; opacity: .26; animation: deriva 38s ease-in-out infinite alternate; }
.fundo::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(14, 42, 34, .92), rgba(14, 42, 34, .55) 70%, rgba(14, 42, 34, .35)); }
@keyframes deriva { to { transform: scale(1.08) translate(-2%, 1.5%) rotate(-1.5deg); } }

.topo, .rodape { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px clamp(16px, 5vw, 56px); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo img { display: block; height: 38px; width: auto; }
.logo__nome { font: 400 1.34rem/1 var(--letra-titulo); letter-spacing: -.025em; white-space: nowrap; }
.logo__nome b { font-weight: 800; margin-left: .2em; }
.redes { display: flex; gap: 8px; }
.redondo { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .28); text-decoration: none; transition: background-color .25s, border-color .25s, transform .35s var(--mola); }
.redondo:hover { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .6); transform: translateY(-2px); }
.icone { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.centro { display: grid; place-items: center; text-align: center; padding: 24px 16px 40px; }
.etiqueta { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 0 0 22px; color: var(--amarelo); font: 700 .8rem/1.3 var(--letra); letter-spacing: .16em; text-transform: uppercase; }
.etiqueta::before { content: ""; flex: none; width: 30px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--menta) 0 20%, var(--amarelo) 0 40%, var(--magenta) 0 60%, #F48020 0 80%, #E43C30 0); }
h1 { position: relative; display: inline-block; margin: 0; font: 750 clamp(4.2rem, 16vw, 10.5rem)/.92 var(--letra-titulo); letter-spacing: -.035em; }
h1 .p { display: inline-block; animation: sobe .9s var(--mola) both; }
h1 .p:nth-child(2) { animation-delay: .08s; }
@keyframes sobe { from { transform: translateY(.28em) rotate(2deg); } }
.destaque { position: relative; color: var(--menta-claro); }
/* O traço do site, desenhado por recorte (com non-scaling-stroke o pathLength não bate). */
.traco { position: absolute; left: -2%; bottom: -.12em; width: 104%; height: .3em; overflow: visible; pointer-events: none; animation: desenha .9s var(--suave) .5s both; }
.traco path { fill: none; stroke: var(--magenta); stroke-width: 6; stroke-linecap: round; vector-effect: non-scaling-stroke; }
@keyframes desenha { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.faceta { position: absolute; width: .2em; height: .18em; clip-path: polygon(50% 0, 100% 100%, 0 100%); animation: flutua 6s ease-in-out infinite; }
/* Os triângulos ficam à volta do título, nunca em cima das letras. */
.faceta--1 { right: -.3em; top: -.04em; background: var(--amarelo); rotate: 14deg; }
.faceta--2 { left: -.32em; bottom: .02em; background: var(--magenta); width: .14em; height: .13em; rotate: -18deg; animation-delay: -2s; }
.faceta--3 { right: -.12em; bottom: -.42em; background: var(--menta-claro); width: .11em; height: .1em; rotate: 32deg; animation-delay: -4s; }
@keyframes flutua { 50% { translate: 0 -.06em; } }
.frase { max-width: 30rem; margin: 34px auto 30px; color: var(--texto-2); font-size: clamp(1.05rem, 2.6vw, 1.2rem); text-wrap: balance; }
.accoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.botao { display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 2px solid transparent; font: 650 1rem/1 var(--letra); text-decoration: none; white-space: nowrap; transition: transform .35s var(--mola), background-color .25s, border-color .25s; }
.botao:hover { transform: translateY(-2px); }
.botao--whatsapp { background: var(--verde-vivo); color: var(--tinta); }
.botao--whatsapp:hover { background: #1fc35d; }
.botao--contorno { border-color: rgba(255, 255, 255, .34); color: var(--texto); }
.botao--contorno:hover { border-color: #fff; background: rgba(255, 255, 255, .06); }

.rodape { justify-content: center; flex-wrap: wrap; gap: 6px 18px; color: var(--texto-2); font-size: .82rem; }
.rodape a { text-underline-offset: 3px; }

@media (max-width: 520px) {
  .logo img { height: 32px; } .logo__nome { font-size: 1.16rem; }
  .etiqueta { gap: 9px; font-size: .68rem; letter-spacing: .09em; }
  .etiqueta::before { width: 22px; }
  .redondo { width: 40px; height: 40px; }
  .accoes .botao { width: min(100%, 320px); justify-content: center; }
}
@media (max-width: 360px) { .logo__nome { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
