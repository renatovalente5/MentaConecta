name: Publicar

# Cada envio para a main gera o site, audita-o e publica-o no GitHub Pages.
# Quando houver painel, os commits dele publicam-se pelo mesmo caminho.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # As regras dos dados (scripts/regras.mjs, as mesmas que o painel vai usar),
      # à prova com dados de ensaio e com os dados de hoje.
      - name: Testar as regras
        run: node scripts/test-regras.mjs
      # A guarda dos dados: pára só o que não se contorna (a estrutura, a marca, os
      # contactos…). Um artigo ou um pack com um erro sai do site e os outros
      # publicam-se: o gerador aplica a mesma neutralização à cópia que lê.
      - name: Guarda dos dados
        run: node scripts/guarda.mjs
      # Sem dependências: não há npm ci. O CNAME, quando existir, decide se o
      # site se constrói para a raiz de um domínio ou para /MentaConecta/.
      - name: Gerar o site
        run: node scripts/gerar.mjs
      # O travão: ligações, ids, preços = contas, contrastes, orçamentos de peso,
      # nada carregado de fora, noindex sem domínio. Se falhar, fica no ar o anterior.
      - name: Auditar antes de publicar
        run: node scripts/auditar.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
