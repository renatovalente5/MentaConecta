name: Publicar

# Cada envio para a main gera o site, audita-o e publica-o no ALOJAMENTO DA MENTA (o cPanel do
# Yuri na PTisp, cpp88.webserver.pt), por FTP com TLS. Desde 11 nov 2026 — até aí era o GitHub Pages.
# Até ao lançamento:
#   previa.mentaconecta.pt  ← o site inteiro, em pré-visualização (noindex): é para onde vai o
#                              «Abrir no site» do painel, e onde a Menta vê o que regista;
#   mentaconecta.pt         ← a página «Em breve» (em-breve/), pedida pelo Yuri.
# O LANÇAMENTO: CNAME → mentaconecta.pt, `demo: false` no dados/marca.json, e no passo «Publicar no
# alojamento» a _site passa a ir para public_html/ (e o «Em breve» deixa de se publicar).
# O painel lê o resultado do job «publicar» pelo nome (src/admin/github.js do painel): não mudar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # As regras dos dados (scripts/regras.mjs, as mesmas que o painel vai usar),
      # à prova com dados de ensaio e com os dados de hoje.
      - name: Testar as regras
        run: node scripts/test-regras.mjs
      # A guarda dos dados: pára só o que não se contorna (a estrutura, a marca, os
      # contactos…). Um artigo ou um pack com um erro sai do site e os outros
      # publicam-se: o gerador aplica a mesma neutralização à cópia que lê.
      - name: Guarda dos dados
        run: node scripts/guarda.mjs
      # As fotografias dos artigos (desde 11 nov 2026): as versões para a web, em WebP, pelo
      # scripts/fotos.py. A pasta .cache/fotos fica entre publicações: só se faz o que falta.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar o Pillow
        run: pip install --quiet Pillow
      - uses: actions/cache@v4
        with:
          path: .cache/fotos
          key: fotos-${{ hashFiles('media/fotos/**', 'scripts/fotos.py') }}
          restore-keys: fotos-
      - name: Preparar as fotografias
        run: python scripts/fotos.py
      # Sem dependências: não há npm ci. O CNAME decide para que endereço se constrói.
      - name: Gerar o site
        run: node scripts/gerar.mjs
      # O travão: ligações, ids, preços = contas, contrastes, orçamentos de peso,
      # nada carregado de fora, noindex sem domínio. Se falhar, fica no ar o anterior.
      - name: Auditar antes de publicar
        run: node scripts/auditar.mjs
      # O site gerado passa para o job que publica (com o .htaccess: include-hidden-files).
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 3

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      # O checkout traz o scripts/publicar-ftp.py e a pasta em-breve/.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      # A conta de FTP publicar@mentaconecta.pt só serve para isto (a senha é o segredo FTP_SENHA;
      # a do cPanel nunca vem para aqui). Sobe só o que mudou e apaga só o que ela própria
      # publicou: o que o cPanel lá põe (/.well-known/ do certificado, cgi-bin) não se toca.
      # A PRIMEIRA linha é o site (o ensaio do painel lê-a assim); a segunda, o «Em breve».
      - name: Publicar no alojamento
        env:
          FTP_SENHA: ${{ secrets.FTP_SENHA }}
        run: |
          python3 scripts/publicar-ftp.py _site previa.mentaconecta.pt
          python3 scripts/publicar-ftp.py em-breve public_html
